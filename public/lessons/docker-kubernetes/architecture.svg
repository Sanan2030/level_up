<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850" role="img" aria-labelledby="title desc">
<title id="title">From a Docker image to a Kubernetes application</title><desc id="desc">A Dockerfile builds an image stored in a registry. A Deployment manages ReplicaSets and Pods in a namespace. The control plane schedules Pods onto nodes. A Service selects ready Pods. ConfigMap provides non-secret settings, while Vault Agent renders credentials to a file.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55665d" stroke-width="1.4"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dae3db"/></pattern></defs>
<rect width="1040" height="850" rx="24" fill="#f8faf6"/><rect width="1040" height="850" rx="24" fill="url(#dots)"/>
<g font-family="Arial, sans-serif" fill="#28382f"><text x="40" y="44" fill="#9c492e" font-size="12" font-weight="700" letter-spacing="2">THE WHOLE PICTURE</text><text x="40" y="82" font-size="29" font-weight="700">One image. Many Pods. A declared desired state.</text>
<g stroke="#d5dfd4" stroke-width="1.5"><rect x="40" y="115" width="205" height="86" rx="14" fill="#fff"/><rect x="295" y="115" width="205" height="86" rx="14" fill="#fbede5"/><rect x="550" y="115" width="205" height="86" rx="14" fill="#fff"/><rect x="805" y="115" width="195" height="86" rx="14" fill="#e8f0e9"/></g>
<g font-size="18" font-weight="700"><text x="62" y="151">Dockerfile</text><text x="317" y="151">Container image</text><text x="572" y="151">Registry</text><text x="827" y="151">Kubernetes</text></g><g font-size="13" fill="#536459"><text x="62" y="178">Build instructions</text><text x="317" y="178">Packaged application</text><text x="572" y="178">Store and pull images</text><text x="827" y="178">Run desired workloads</text></g>
<g fill="none" stroke="#55665d" stroke-width="1.5" marker-end="url(#arrow)"><path d="M247 157H286"/><path d="M502 157H542"/><path d="M757 157H797"/></g>
<rect x="40" y="242" width="960" height="554" rx="20" fill="#fff" stroke="#bdcdbd" stroke-width="2"/>
<text x="64" y="276" font-size="16" font-weight="700">KUBERNETES CLUSTER</text>
<rect x="64" y="299" width="912" height="83" rx="12" fill="#f0ecf6"/><text x="86" y="330" font-size="17" font-weight="700">Control plane</text><text x="86" y="356" font-size="13">API server · etcd · scheduler · controller manager</text><text x="675" y="331" font-size="13">Accept → store → reconcile → schedule</text><text x="675" y="355" font-size="12" fill="#536459">kubelet + CRI runtime run containers on nodes</text>
<rect x="64" y="404" width="625" height="365" rx="14" fill="#f7f9f5" stroke="#a7bba9" stroke-dasharray="6 5"/><text x="84" y="436" font-size="15" font-weight="700">NAMESPACE / demo</text><text x="84" y="457" font-size="12" fill="#536459">Logical scope; not a network firewall</text>
<rect x="92" y="482" width="240" height="55" rx="10" fill="#f0ecf6" stroke="#d5dfd4"/><text x="112" y="514" font-size="16" font-weight="700">Deployment / orders</text>
<rect x="92" y="568" width="240" height="55" rx="10" fill="#fbede5" stroke="#d5dfd4"/><text x="112" y="600" font-size="16" font-weight="700">ReplicaSet / orders-v1</text>
<g fill="none" stroke="#55665d" stroke-width="1.5" marker-end="url(#arrow)"><path d="M212 538V561"/><path d="M212 624V645H153V667"/><path d="M212 645H315V667"/></g><text x="229" y="555" font-size="11">manages</text>
<g stroke="#a7bba9"><rect x="92" y="674" width="133" height="72" rx="10" fill="#e8f0e9"/><rect x="254" y="674" width="133" height="72" rx="10" fill="#e8f0e9"/></g><g font-size="15" font-weight="700"><text x="109" y="701">Pod / orders-a</text><text x="271" y="701">Pod / orders-b</text></g><g font-size="12"><text x="109" y="725">app: orders · ready</text><text x="271" y="725">app: orders · ready</text></g>
<rect x="416" y="482" width="245" height="74" rx="10" fill="#fff" stroke="#a7bba9"/><text x="436" y="511" font-size="16" font-weight="700">Service / orders</text><text x="436" y="537" font-size="12">selector: app=orders</text><path d="M530 558V709H395" fill="none" stroke="#55665d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="540" y="616" font-size="12">routes to</text><text x="540" y="634" font-size="12">ready Pods</text>
<rect x="714" y="404" width="262" height="105" rx="12" fill="#fbede5" stroke="#d5dfd4"/><text x="734" y="438" font-size="17" font-weight="700">ConfigMap</text><text x="734" y="464" font-size="13">LOG_LEVEL=info</text><text x="734" y="487" font-size="12">Non-confidential configuration</text>
<rect x="714" y="539" width="262" height="132" rx="12" fill="#f0ecf6" stroke="#d5dfd4"/><text x="734" y="574" font-size="17" font-weight="700">Vault → Vault Agent</text><text x="734" y="600" font-size="13">ServiceAccount → scoped policy</text><text x="734" y="625" font-size="13">Credentials → shared memory file</text><text x="734" y="649" font-size="12">Application must reload updates</text>
<text x="714" y="710" font-size="12" fill="#536459">Vault is a separate service.</text><text x="714" y="731" font-size="12" fill="#536459">It may run inside or outside the cluster.</text><text x="40" y="826" font-size="12" fill="#536459">Ownership, traffic and configuration are different relationships. A namespace groups objects across nodes.</text></g></svg>
